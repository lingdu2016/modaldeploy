name: Modal Auto Deploy

on:
  push:
    branches:
      - main
    paths:
      - "*.py" # 只要任意 .py 文件有修改就允许触发，这里永不需要修改！

  workflow_dispatch: # 允许在 GitHub 网页端手动点击触发

jobs:
  deploy:
    name: Deploy to Modal
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Modal Client
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Deploy Modal App
        run: |
          # -----------------------------------------------------------------
          # 【唯一需要修改的地方】取消注释你需要部署的那一行即可
          # -----------------------------------------------------------------
          # modal deploy comfyui-wan22-5b.py
          # modal deploy app.py
          # modal deploy llama.py
          # modal deploy vllm-qwen3-8b-awq.py
          # modal deploy lmdeploy-qwen3-8b-awq.py
          # modal deploy llama-Qwen3-14B-Q5-gguf.py
          # modal deploy llama-Qwen35-27B-WebNovelWriter-Q4-gguf.py
          # modal deploy llama-Qwen3-vl-8B-Q8-gguf.py  #没有部署
          #####gpu限制，需要gpu的无法部署，下面是cpu部署的项目
          # modal deploy edge_tts_web.py
          modal deploy cpu-vaultwarden.py  ##个人密码保存
  

