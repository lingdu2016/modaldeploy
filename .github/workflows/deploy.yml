name: Modal Auto Deploy

on:
  push:
    branches:
      - main  # 当代码推送到 main 分支时自动触发
  workflow_dispatch: # 允许在 GitHub 网页端手动点击触发

jobs:
  deploy:
    name: Deploy to Modal
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      # 如果你使用了 Modal 的多环境功能，可以取消下面这行的注释
      # MODAL_ENVIRONMENT: production 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Modal Client
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Deploy Modal App
        run: |
          # 将 app.py 替换为你实际的入口文件模块路径
          #modal deploy app.py
          modal deploy llama.py
